version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: qybernex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qybernex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qybernex_dev_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-qybernex_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qybernex} -d ${POSTGRES_DB:-qybernex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qybernex-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qybernex-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-QYBERNEX}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-qybernex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qybernex_dev_password_change_in_prod}
      - POSTGRES_DB=${POSTGRES_DB:-qybernex_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qybernex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
